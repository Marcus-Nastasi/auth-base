version: '3.8'

services:
  auth-base-postgres:
    image: postgres:15
    container_name: auth-base-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: postgres
    volumes:
      - postgres-data-auth-base:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - auth-base-network

networks:
  auth-base-network:
    driver: bridge

volumes:
  postgres-data-auth-base:
