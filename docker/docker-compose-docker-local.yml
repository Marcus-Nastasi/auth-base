version: '3.8'

services:

  auth-base-postgres:
    image: postgres:15
    container_name: auth-base-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: postgres
    volumes:
      - postgres-data-auth-base:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - auth-base-network

  auth-base-backend:
    build:
      context: ../app/
      dockerfile: Dockerfile-local
    image: auth-base-backend:latest
    container_name: auth-base-backend
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: docker-local
    networks:
      - auth-base-network
    depends_on:
      - auth-base-postgres

networks:
  auth-base-network:
    driver: bridge

volumes:
  postgres-data-auth-base:
