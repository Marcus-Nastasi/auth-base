name: Build e Push no ECR

on:
  push:
    branches: [main]

env:
  AWS_REGION: sa-east-1
  ECR_REPOSITORY: auth-base

jobs:
  test:
    uses: ./.github/workflows/modules/test.yml
    secrets: inherit

  terraform-validate:
    needs: test
    uses: ./.github/workflows/modules/tf_validate.yml
    secrets: inherit

  terraform-plan:
    needs: terraform-validate
    uses: ./.github/workflows/modules/tf_plan.yml
    secrets: inherit

  terraform-apply:
    needs: terraform-plan
    uses: ./.github/workflows/modules/tf_apply.yml
    secrets: inherit

  build-and-push:
    needs: terraform-apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build da aplicação
        working-directory: app
        run: mvn package -DskipTests

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag e push da imagem Docker
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}   # usa o hash do commit como tag
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f app/Dockerfile app/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    outputs:
      image: ${{ steps.build-image.outputs.image }}
