name: Build e Push no ECR

on:
  push:
    branches: [main]

jobs:
  set-env:
    name: Set environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Define env
        id: set-env
        run: |
          echo "aws_region=sa-east-1" >> $GITHUB_OUTPUT

          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "environment=" >> $GITHUB_OUTPUT
          fi

  test:
    name: Java test
    needs: set-env
    uses: ./.github/workflows/test.yml
    secrets: inherit

  terraform-validate:
    name: Terraform validate
    needs: [ set-env ]
    uses: ./.github/workflows/tf_validate.yml
    secrets: inherit
    with:
      environment: ${{ needs.set-env.outputs.environment }}

  terraform-apply:
    name: Terraform plan and apply
    needs: [ set-env, test, terraform-validate ]
    uses: ./.github/workflows/tf_apply.yml
    secrets: inherit
    with:
      environment: ${{ needs.set-env.outputs.environment }}

  build-and-push:
    name: Build and push ECR
    needs: [ set-env, terraform-apply ]
    uses: ./.github/workflows/deploy_ecr.yml
    secrets: inherit
    with:
      aws_region: ${{ needs.set-env.outputs.aws_region }}
